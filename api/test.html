<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPR Farm — API Test Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f7fb;
    color: #0f172a;
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.5;
  }
  .container { max-width: 780px; margin: 0 auto; }
  
  .header { margin-bottom: 28px; }
  h1 { font-size: 1.65rem; color: #0f172a; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  h1 i { color: #16a34a; }
  .subtitle { color: #64748b; font-size: 0.92rem; }

  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    margin-bottom: 24px;
  }
  .card h2 { font-size: 1.05rem; color: #1e293b; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .card h2 i { color: #16a34a; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  label { font-size: 0.83rem; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px 14px;
    color: #0f172a;
    font-size: 0.92rem;
    outline: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  input:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
  }

  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  button {
    width: 100%;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: #16a34a;
    color: #ffffff;
    box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
  }
  .btn-primary:hover {
    background: #15803d;
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(22, 163, 74, 0.25);
  }
  .btn-primary:active { transform: translateY(0); }

  .url-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #15803d;
    word-break: break-all;
    margin-top: 18px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .result {
    margin-top: 18px;
    background: #f8fafc;
    color: #0f172a;
    border-radius: 10px;
    padding: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.84rem;
    min-height: 70px;
    border: 1px solid #e2e8f0;
    border-left: 4px solid #64748b;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .result.success { border-left-color: #16a34a; background: #f0fdf4; }
  .result.error   { border-left-color: #ef4444; background: #fef2f2; }
  .status-badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
  }
  .status-ok  { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .status-err { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #64748b;
    margin-top: 10px;
    font-weight: 500;
  }
  .spinner { display: none; color: #64748b; font-size: 0.88rem; margin-top: 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1><i class="fa-solid fa-leaf"></i> GPR Farm — API Test Panel</h1>
    <p class="subtitle">Test your sensor API before connecting real hardware</p>
  </div>

  <!-- Input Fields -->
  <div class="card">
    <h2><i class="fa-solid fa-microchip"></i> Sensor Parameters</h2>
    <div class="grid">
      <div>
        <label>API Key</label>
        <input type="text" id="key" value="GPRFarm">
      </div>
      <div>
        <label>User ID</label>
        <input type="number" id="user_id" value="2">
      </div>
      <div>
        <label>Temperature (°C)</label>
        <input type="number" id="temp" value="20" step="0.1">
      </div>
      <div>
        <label>Humidity RH (%)</label>
        <input type="number" id="rh" value="90" step="0.1">
      </div>
      <div>
        <label>Sunlight (hrs)</label>
        <input type="number" id="sunlight" value="6" step="0.1">
      </div>
      <div>
        <label>Rainfall (mm)</label>
        <input type="number" id="rainfall" value="2" step="0.1">
      </div>
      <div>
        <label>Leaf Wetness</label>
        <input type="number" id="leafw" value="3.2" step="0.1">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="runTest()">
        <i class="fa-solid fa-paper-plane"></i> Test & Ingest API Data (Saves to DB)
      </button>
    </div>

    <div class="url-box" id="urlBox">← click the button to send test telemetry to database</div>
    <div class="spinner" id="spinner"><i class="fa-solid fa-spinner fa-spin"></i> Waiting for server response...</div>
    <div class="result" id="result"></div>
    <div class="info-row" id="infoRow"></div>
  </div>

</div>

<script>
function buildParams() {
  return {
    key:      document.getElementById('key').value,
    temp:     document.getElementById('temp').value,
    rh:       document.getElementById('rh').value,
    sunlight: document.getElementById('sunlight').value,
    user_id:  document.getElementById('user_id').value,
    rainfall: document.getElementById('rainfall').value,
    leafw:    document.getElementById('leafw').value
  };
}

function buildUrl(endpoint) {
  const p   = buildParams();
  const qs  = Object.entries(p).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const dir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
  const base = window.location.origin + dir + '/' + endpoint + '.php';
  return `${base}?${qs}`;
}

async function runTest() {
  const endpoint = 'adddata';
  const url      = buildUrl(endpoint);

  document.getElementById('urlBox').textContent = url;
  document.getElementById('spinner').style.display = 'block';

  const resultEl  = document.getElementById('result');
  const infoEl    = document.getElementById('infoRow');
  resultEl.style.display = 'none';

  const t0 = Date.now();

  try {
    const res  = await fetch(url);
    const ms   = Date.now() - t0;
    const text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch(_) {}

    const ok = res.ok || res.status === 201;
    resultEl.className = 'result ' + (ok ? 'success' : 'error');
    resultEl.innerHTML =
      `<span class="status-badge ${ok ? 'status-ok' : 'status-err'}">HTTP ${res.status}</span>\n` + pretty;
    resultEl.style.display = 'block';
    infoEl.innerHTML = `<span>⏱ ${ms}ms</span><span>${new Date().toLocaleTimeString()}</span>`;
  } catch (err) {
    resultEl.className = 'result error';
    resultEl.innerHTML = `<span class="status-badge status-err">NETWORK ERROR</span>\n${err.message}\n\nTip: Make sure the server backend is active.`;
    resultEl.style.display = 'block';
    infoEl.innerHTML = '';
  }

  document.getElementById('spinner').style.display = 'none';
}
</script>
</body>
</html>
